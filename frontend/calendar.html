<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EventPulse | Calendar</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">CAMPUS EXPERIENCE PLATFORM</p>
        <h1>EventPulse</h1>
        <p>Interactive calendar view of upcoming campus events, workshops, and hackathons.</p>
        <nav class="nav-links">
          <a href="index.html">Dashboard</a>
          <a href="events.html">Events</a>
          <a href="calendar.html" class="active">Calendar</a>
          <a href="users.html">Users</a>
          <a href="attendance.html">Attendance</a>
          <div class="user-badge" id="user-badge" style="display:none;"></div>
          <a href="login.html" id="login-link" class="btn-login" style="display:none;">Sign in</a>
        </nav>
      </header>
      
      <section class="calendar-container">
        <div class="calendar-header">
          <h2 id="calendar-month-year">Loading Calendar…</h2>
          <div class="calendar-nav">
            <button id="prev-month" class="btn-secondary">◀ Prev</button>
            <button id="today-month" class="btn-secondary">Today</button>
            <button id="next-month" class="btn-secondary">Next ▶</button>
          </div>
        </div>
        <div class="calendar-grid" id="calendar-grid">
          <p class="empty">Loading events on calendar…</p>
        </div>
      </section>
    </main>
    <script src="auth.js"></script>
    <script src="calendar.js"></script>
  </body>
</html>
